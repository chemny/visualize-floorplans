interface:
  display_name: "Floor Visualization"
  short_description: "Review plans, edit H5 2D/3D schemes and prepare interior walkthroughs"
  default_prompt: "Use $visualize-floorplans starting from one floor-plan image and the user's needs; furniture and style references are optional. Read references/guided-user-workflow.md. Interpret and self-check continuously, then use three concentrated decision rounds: plan/access and essential needs, furniture/function layout, and style/output scope. Batch only missing consequential questions with recommended choices and reasons; do not stop progress to ask for another continue. Preserve exact-scope approvals and source provenance. Use one canonical H5 case from plan confirmation, export drawings from its state, and apply furniture-placement-principles.md. Then refine the editable H5 2D/3D workbench and agreed interior images from one scheme, presenting final outputs together for separate acceptance. Keep video, Blender and Seedance optional; retain all quality gates and never promote diagnostic previews."
