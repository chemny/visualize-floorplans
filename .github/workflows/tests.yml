name: Source and workflow regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python drawing dependencies
        run: python -m pip install -r requirements.txt
      - name: Pinned development tools for module regression
        run: npm install --prefix .ci-tools --no-save --ignore-scripts --no-audit --no-fund --no-package-lock three@0.180.0 esbuild@0.25.10
      - name: Shared source regression (no Blender, browser or remote jobs)
        run: python scripts/release_smoke.py --out .ci-evidence --node node --test-node-modules .ci-tools/node_modules
