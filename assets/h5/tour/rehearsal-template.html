<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全屋参观路线 · 动态预演</title><style>__STYLE__</style><header><a class="brand" href="index.html">全屋参观</a></header><!--stage-nav-start-->__NAV__<!--stage-nav-end--><div class="heading"><div><h1>全屋参观路线</h1><p>__INTRO__</p></div><div class="route-actions">__ACTIONS__</div></div><main class="main"><div class="route-workspace"><section class="route-plan"><div class="map-heading"><span>户型与路线</span><span class="map-legend"><i class="blue"></i>走向 <i class="gold"></i>镜头视野</span></div><main class="scene">__PLAN__</main></section><aside class="sequence"><div class="sequence-title"><h2>参观顺序</h2><span>时间点</span></div><div class="sequence-list">__CARDS__</div><div class="controls"><button id="slower">0.5×</button><button id="normal">1×</button><button id="faster">2×</button><button id="reset">重播</button></div><div id="phase" class="notes"></div></aside></div><footer class="route-transport"><button class="primary action" id="play">播放</button><div class="progress"><input id="seek" aria-label="路线进度" type="range" min="0" max="__END__" step="__STEP__" value="0"><div id="clock"><span id="time"></span><span id="room"></span></div></div><span class="route-duration">__DURATION__</span></footer></main><script>const tour=__TOUR__,walls=__WALLS__,visits=__VISITS__,chapters=__CHAPTERS__;let t=0,running=false,speed=1,last=0;const $=s=>document.getElementById(s);function intersectRay(p,a){let dx=Math.cos(a),dy=Math.sin(a),best=8000;for(const [s,e,r]of walls){let lo=[Math.min(s[0],e[0])-r,Math.min(s[1],e[1])-r],hi=[Math.max(s[0],e[0])+r,Math.max(s[1],e[1])+r],near=0,far=best;for(let j=0;j<2;j++){let v=j?dy:dx;if(Math.abs(v)<1e-8){if(p[j]<lo[j]||p[j]>hi[j]){far=-1;break;}}else{let aa=(lo[j]-p[j])/v,bb=(hi[j]-p[j])/v;near=Math.max(near,Math.min(aa,bb));far=Math.min(far,Math.max(aa,bb));}}if(far>=near&&near>1)best=Math.min(best,near);}return [p[0]+dx*best,p[1]+dy*best,best];}function update(){let f=tour.frames[Math.min(tour.frames.length-1,Math.round(t*tour.fps))],p=f.pointMm,a=f.yawRadians,points=[p];for(let j=0;j<=48;j++)points.push(intersectRay(p,a+(j/48-.5)*(f.horizontalFovDegrees||76)*Math.PI/180));$('cone').setAttribute('d','M'+points.map(q=>q[0]+','+q[1]).join(' L')+' Z');let end=intersectRay(p,a);$('axis').setAttribute('d',`M${p} L${end[0]},${end[1]}`);let ii=Math.min(tour.frames.length-1,Math.round(t*tour.fps)),pa=tour.frames[Math.max(0,ii-3)].pointMm,pb=tour.frames[Math.min(tour.frames.length-1,ii+3)].pointMm,heading=Math.atan2(pb[1]-pa[1],pb[0]-pa[0]);$('travel').setAttribute('transform',`translate(${p}) rotate(${heading*180/Math.PI})`);$('camera').setAttribute('transform',`translate(${p}) rotate(${a*180/Math.PI})`);$('seek').value=t;$('time').textContent=t.toFixed(1)+' / '+tour.seconds.toFixed(1)+' 秒';let k=visits.findLastIndex(v=>v.seconds<=t);$('room').textContent=visits[Math.max(0,k)].name;document.querySelectorAll('.chapter').forEach((c,i)=>c.classList.toggle('active',i===k));let ch=chapters.find(c=>t>=c.startSeconds&&t<c.endSeconds);$('phase').textContent=ch?ch.name:'';}function play(){running=!running;if(t>=tour.seconds-1/tour.fps)t=0;$('play').textContent=running?'暂停':'播放';} $('faster').onclick=()=>speed=2;$('play').onclick=play;$('reset').onclick=()=>{t=0;running=true;$('play').textContent='暂停'};$('slower').onclick=()=>speed=.5;$('normal').onclick=()=>speed=1;$('seek').oninput=()=>{t=Number($('seek').value);running=false;$('play').textContent='播放';update()};document.querySelectorAll('.chapter').forEach(c=>c.onclick=()=>{t=Number(c.dataset.time);running=false;$('play').textContent='播放';update()});document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'){e.preventDefault();play()}});function tick(now){if(running&&last)t=Math.min(tour.seconds-1/tour.fps,t+(now-last)/1000*speed);if(t>=tour.seconds-1/tour.fps){running=false;$('play').textContent='重播'}last=now;update();requestAnimationFrame(tick)}window.rehearsalPlayback={setTime(value){t=Math.max(0,Math.min(tour.seconds-1/tour.fps,value));running=false;update()},getTime(){return t}};document.querySelectorAll('.chapter').forEach(c=>c.addEventListener('click',()=>{if(parent!==window)parent.postMessage({kind:'homeowner-seek',seconds:Number(c.dataset.time)},location.origin)}));requestAnimationFrame(tick);</script></html>
