<style>__STYLE__
.shell{max-width:1500px;margin:auto;padding:24px} .compare{display:grid;grid-template-columns:240px 1fr;gap:18px}.choices{display:flex;gap:0;background:#eee6da;border-radius:10px;padding:4px;width:max-content;margin-bottom:14px}.choices button{border:0;background:none;padding:10px 18px;border-radius:7px;color:#756b5e;cursor:pointer}.choices .active{background:#fffaf3;color:#7d4f2e}.clips{background:#fffcf6;border:1px solid #ddd3c4;border-radius:14px;padding:16px}.clips button{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:none;padding:14px 12px;margin-bottom:6px;cursor:pointer;color:#60574b}.clips button.active{background:#eee3d2;color:#80542e}.clips small{display:block;margin-top:8px;color:#8b8277}.viewer{background:#eae6de;border-radius:14px;overflow:hidden;aspect-ratio:16/9}iframe{width:100%;height:100%;border:0}.controls{display:flex;align-items:center;gap:12px;margin:16px 0}.controls button,.measure{border:1px solid #cdbca7;border-radius:8px;background:#fffaf2;color:#7d5433;padding:9px 16px;cursor:pointer}input{flex:1;min-width:80px;accent-color:#987047}#clock{white-space:nowrap;font-size:13px}.measurement{margin-top:20px;padding:16px;border:1px solid #ddd3c4;border-radius:12px;background:#fffaf3}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}td,th{text-align:left;padding:8px;border-bottom:1px solid #ece3d6}#note{font-size:13px;line-height:1.7;color:#82776b}#loading{color:#8c7760}.readiness{font-size:13px;color:#8c7760;margin:8px 0}@media(max-width:800px){.compare{grid-template-columns:1fr}.clips{display:flex;gap:4px;padding:6px}.clips button{padding:9px;margin:0}.clips small{font-size:11px}.choices{width:auto}.choices button{flex:1;padding:10px 8px}}</style>
<body><main class="shell"><header><a href="../continuous-current/route.html">全屋参观</a></header><h1>三段运镜对照</h1><p class="lead">在同一模型、同一画幅中切换比较，均以正常速度播放。</p><div class="compare"><aside class="clips" id="clips"></aside><section><div class="choices"><button data-mode="legacy">原版</button><button data-mode="smooth">仅播放优化</button><button data-mode="motion" class="active">运镜试调</button></div><p id="loading">正在加载模型…</p><div class="viewer"><iframe id="view" src="runtime/renderer.html" title="三维运镜对照"></iframe></div><div class="controls"><button id="play">播放</button><button id="reset">重播</button><input id="seek" aria-label="片段进度" type="range" min="0" max="1" step="any"><span id="clock"></span></div><p id="note"></p><p class="readiness">先比较样段，再合并全片；尚未生成视频。</p></section></div><section class="measurement"><button class="measure" id="measure">实测当前片段</button><span id="measure-status"></span><table><thead><tr><th>版本</th><th>画面更新/秒</th><th>更新间隔 P95</th><th>超过100ms</th><th>更新耗时 P95</th></tr></thead><tbody id="measurements"></tbody></table></section></main><script type="module" src="motion-comparison.js"></script></body></html>
