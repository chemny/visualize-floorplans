<!doctype html><meta charset="utf-8"><title>Floor Visualization · geometry replay</title><style>html,body{margin:0;overflow:hidden;background:#f2efe9}canvas{display:block}</style><script type="module">
import * as THREE from './three.module.js';
const [data,buffer]=await Promise.all([fetch('./scene.json').then(r=>r.json()),fetch('./geometry.bin').then(r=>r.arrayBuffer())]);

// Only viewing lights differ from the workbench; geometry/material stream is unchanged.

const span=Math.max(data.model.width,data.model.depth)/1000+2;
const sun=new THREE.DirectionalLight('#fffdf9',1.6);sun.position.set(-5,9,-10);sun.target.position.set(0,0,-1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-span,right:span,top:span,bottom:-span,near:.1,far:Math.max(35,span*4)});sun.shadow.bias=-.0003;sun.shadow.normalBias=.025;scene.add(sun,sun.target);

const camera=new THREE.PerspectiveCamera(45,3/2,.04,50);scene.updateMatrixWorld(true);const ray=new THREE.Raycaster(),ids=new Map(data.state.furniture.map(f=>[f.id,f]));
window.setBodyRadiusMm=mm=>{if(!Number.isFinite(mm)||mm<=0)throw Error('Positive body envelope required');settings.bodyRadiusMm=mm;};
function inside(x,y,poly){let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])ok=!ok;}return ok;}
window.renderView=async v=>{const size=v.size||settings.size,aspect=size[0]/size[1];renderer.setSize(...size);camera.aspect=aspect;const height=(v.heightMm??1600)/1000,point=new THREE.Vector3((v.point[0]-data.model.width/2)/1000,height,(v.point[1]-data.model.depth/2)/1000),target=new THREE.Vector3((v.target[0]-data.model.width/2)/1000,(v.targetHeightMm??v.heightMm??1600)/1000,(v.target[1]-data.model.depth/2)/1000);camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad((v.horizontalFovDegrees??76))/2)/aspect));camera.position.copy(point);camera.up.set(0,1,0);camera.lookAt(target);camera.updateProjectionMatrix();camera.projectionMatrix.elements[9]-=v.shiftY||0;camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();camera.updateMatrixWorld(true);

const visibleObjects={};for(const id of v.mustShow||[]){const objects=meshes.filter(m=>m.visible&&m.userData.objectId===id),box=new THREE.Box3();objects.forEach(m=>box.union(new THREE.Box3().setFromObject(m)));const points=[];for(const x of [box.min.x,box.max.x])for(const y of [box.min.y,box.max.y])for(const z of [box.min.z,box.max.z])points.push(new THREE.Vector3(x,y,z).project(camera));visibleObjects[id]={name:ids.get(id)?.name,projectedBounds:{x0:Math.min(...points.map(p=>p.x)),x1:Math.max(...points.map(p=>p.x)),y0:Math.min(...points.map(p=>p.y)),y1:Math.max(...points.map(p=>p.y))},footprintMm:ids.get(id)&&[ids.get(id).w,ids.get(id).d]};}

window.renderFrame=async f=>{
 renderer.setSize(...settings.size);camera.aspect=settings.size[0]/settings.size[1];camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad(f.horizontalFovDegrees||70)/2)/camera.aspect));camera.position.set((f.pointMm[0]-data.model.width/2)/1000,f.eyeMm/1000,(f.pointMm[1]-data.model.depth/2)/1000);camera.up.set(0,1,0);camera.lookAt(camera.position.x+Math.cos(f.yawRadians),camera.position.y+Math.tan(f.pitchRadians),camera.position.z+Math.sin(f.yawRadians));camera.updateProjectionMatrix();camera.projectionMatrix.elements[9]-=f.shiftY??settings.shiftY;camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();camera.updateMatrixWorld(true);renderer.render(scene,camera);await new Promise(r=>requestAnimationFrame(r));renderer.render(scene,camera);
};
window.meshAudit=frames=>{
 const blockers=meshes.filter(m=>m.visible&&m.userData.kind!=='floor'&&!ids.get(m.userData.objectId)?.planPoint&&!['rug','threshold','skirting','doortrim','windowtrim'].includes(ids.get(m.userData.objectId)?.type));const boxes=new Map(blockers.map(m=>[m,new THREE.Box3().setFromObject(m)]));const hits=[];let minimum=Infinity;
 for(const f of frames){const x=(f.pointMm[0]-data.model.width/2)/1000,z=(f.pointMm[1]-data.model.depth/2)/1000;const nearby=blockers.filter(m=>{const b=boxes.get(m);return x>=b.min.x-settings.bodyRadiusMm/1000&&x<=b.max.x+settings.bodyRadiusMm/1000&&z>=b.min.z-settings.bodyRadiusMm/1000&&z<=b.max.z+settings.bodyRadiusMm/1000});for(const h of [.45,1.05,f.eyeMm/1000])for(let i=0;i<24;i++){ray.set(new THREE.Vector3(x,h,z),new THREE.Vector3(Math.cos(i*Math.PI/12),0,Math.sin(i*Math.PI/12)));ray.near=0;ray.far=settings.bodyRadiusMm/1000;const hit=ray.intersectObjects(nearby)[0];if(hit){minimum=Math.min(minimum,hit.distance);hits.push({frame:f.frame,point:f.pointMm,height:h,name:hit.object.name,kind:hit.object.userData.kind,objectId:hit.object.userData.objectId,distanceMm:hit.distance*1000});}}}
 return {bodyRadiusMm:settings.bodyRadiusMm,hits,slidingLeafShift:meshes.filter(m=>m.userData.playbackShiftMm).map(m=>({name:m.name,shiftMm:m.userData.playbackShiftMm})),minimumHitMm:Number.isFinite(minimum)?minimum*1000:null,method:`${frames.length} positions including intra-shot midpoints, 24 radial rays at three body heights, ${settings.bodyRadiusMm}mm radius; cuts are not traversed`};
 };
window.inspectSubjects=ids=>{
 const result={},opaque=meshes.filter(m=>m.visible&&!(Array.isArray(m.material)?m.material:[m.material]).every(a=>a.transparent));
 for(const id of ids){
  const ms=meshes.filter(m=>m.visible&&m.userData.objectId===id),samples=[];
  for(const m of ms){const pos=m.geometry.getAttribute('position'),ix=m.geometry.index,triCount=(ix?ix.count:pos.count)/3;
   for(let j=0;j<triCount;j+=Math.max(1,Math.floor(triCount/12))){const p=new THREE.Vector3();for(let k=0;k<3;k++){const at=ix?ix.getX(j*3+k):j*3+k;p.add(new THREE.Vector3().fromBufferAttribute(pos,at));}samples.push(p.multiplyScalar(1/3).applyMatrix4(m.matrixWorld));}}
  let visible=0,frustum=0;const screenPoints=[];
  for(const p of samples){const screen=p.clone().project(camera);if(!Number.isFinite(screen.x)||screen.z< -1||screen.z>1||Math.abs(screen.x)>1||Math.abs(screen.y)>1)continue;frustum++;
   const d=p.clone().sub(camera.position),dist=d.length();ray.set(camera.position,d.normalize());ray.near=.03;ray.far=dist+.15;const first=ray.intersectObjects(opaque,false)[0];
   if(first?.object.userData.objectId===id){visible++;screenPoints.push(screen);}}
  const area=screenPoints.length>1?(Math.max(...screenPoints.map(p=>p.x))-Math.min(...screenPoints.map(p=>p.x)))*(Math.max(...screenPoints.map(p=>p.y))-Math.min(...screenPoints.map(p=>p.y)))/4:0;
  result[id]={meshCount:ms.length,totalSamples:samples.length,inFrustumSamples:frustum,unoccludedSamples:visible,screenAreaFraction:area};
 }

};
window.inspectShot=async(f,ids)=>{await window.renderFrame(f);return window.inspectSubjects(ids);};
window.inspectComposition=async (f,options={})=>{
 await window.renderFrame(f);let closeArchitecture=0;const hits=[];
 const visible=meshes.filter(m=>m.visible&&!(Array.isArray(m.material)?m.material:[m.material]).every(a=>a.transparent));
 for(const y of [-.45,0,.45])for(const x of [-.7,-.35,0,.35,.7]){
  ray.setFromCamera(new THREE.Vector2(x,y),camera);ray.near=.04;ray.far=50;
  const h=ray.intersectObjects(visible,false)[0];
  const wall=!!h&&h.object.userData.kind==='architecture'&&h.distance<(options.closeDistanceM??2);
  if(wall)closeArchitecture++;hits.push({x,y,kind:h?.object.userData.kind,objectId:h?.object.userData.objectId,distanceM:h?.distance,closeArchitecture:wall});
 }
 return {closeArchitectureRatio:closeArchitecture/15,hits};
};window.inspectDownlights=()=>{
 const faces=meshes.filter(m=>m.visible&&m.name==='recessed-luminous-face');

 for(const face of faces){const centre=new THREE.Box3().setFromObject(face).getCenter(new THREE.Vector3()),f=ids.get(face.userData.objectId);
 for(const angle of [25,45,60]){const dh=centre.y-1.6,offset=dh*Math.tan(THREE.MathUtils.degToRad(angle)),from=new THREE.Vector3(centre.x,1.6,centre.z+offset),delta=centre.clone().sub(from),distance=delta.length();ray.set(from,delta.normalize());ray.near=.03;ray.far=distance+.02;const hit=ray.intersectObjects(opaque,false)[0];tests.push({id:f.id,angleFromVertical:angle,whiteEmission:face.material.emissive.toArray().every(v=>Math.abs(v-1)<1e-6),temperature:f.lightTemperature,firstName:hit?.object.name,firstId:hit?.object.userData.objectId,visible:hit?.object===face,faceHeightMm:centre.y*1000});}}
 return {count:faces.length,tests};
};window.inspectLighting=()=>{
 const fixtures=scene.children.filter(o=>o.isLight&&o.userData.fixtureId).map(o=>({id:o.userData.fixtureId,intensity:o.intensity,color:o.color.toArray()}));
 const primaryIds=data.state.furniture.filter(f=>['ceilinground','lightpanel','linearlight','pendant'].includes(f.type)).map(f=>f.id);
 const opaque=meshes.filter(m=>m.visible&&!(Array.isArray(m.material)?m.material:[m.material]).every(a=>a.transparent));
 const faces=primaryIds.map(id=>{
  const lamps=meshes.filter(m=>m.userData.objectId===id),emitters=lamps.filter(m=>(Array.isArray(m.material)?m.material:[m.material]).some(a=>a.emissive.getHex()&&a.emissiveIntensity>0));
  const visible=emitters.map(m=>{const box=new THREE.Box3().setFromObject(m),p=box.getCenter(new THREE.Vector3());p.y=box.min.y+.00001;const from=new THREE.Vector3(p.x,p.y-.20,p.z),dir=p.clone().sub(from),dist=dir.length();ray.set(from,dir.normalize());ray.near=.0001;ray.far=dist+.02;const hit=ray.intersectObjects(opaque,false)[0];return {name:m.name,intensity:(Array.isArray(m.material)?m.material[0]:m.material).emissiveIntensity,visible:hit?.object===m,firstName:hit?.object.name};});
